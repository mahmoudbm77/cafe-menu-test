<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلويات - Cafe Cinnabon</title>
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <div class="header">
    <a href="../index.html" class="nav-link"><div class="nav-arrow">&#8250;</div></a>
    <div class="logo-wrap">
      <div class="logo">
        <img src="../assets/logo.JPG" alt="Cafe Logo">
      </div>
    </div>
    <div></div>
  </div>

  <div class="section-title">
    <h1>حلويات</h1>
  </div>

  <div class="menu-container">
    <div class="menu-item" data-name="بقلاوة" data-price="4.00">
      <div class="item-details">
        <h2>بقلاوة</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">4.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/sweets/3.webp" alt="بقلاوة">
      </div>
    </div>

    <div class="menu-item" data-name="كنافة" data-price="6.00">
      <div class="item-details">
        <h2>كنافة</h2>
        <div class="qty">طبق واحد</div>
        <div class="price">6.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/sweets/1.webp" alt="كنافة">
      </div>
    </div>

    <div class="menu-item" data-name="بسبوسة" data-price="4.00">
      <div class="item-details">
        <h2>بسبوسة</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">4.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/sweets/4.webp" alt="بسبوسة">
      </div>
    </div>

    <div class="menu-item" data-name="معمول" data-price="5.00">
      <div class="item-details">
        <h2>معمول</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">5.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/sweets/2.webp" alt="معمول">
      </div>
    </div>
  </div>

<script src="../js/cart.js"></script>
</body>
</html>
