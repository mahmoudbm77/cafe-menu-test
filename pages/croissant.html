</html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بريوش - Cafe Cinnabon</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #0d0d0d;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 20px 40px;
  }

  .nav-link {
    justify-self: start;
    text-decoration: none;
  }

  .logo-wrap {
    justify-self: center;
  }

  .logo {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid #d98e3d;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    overflow: hidden;
    margin: 0 auto;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .nav-arrow {
    width: 45px;
    height: 45px;
    border: 1px solid #444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .nav-arrow:hover {
    background: rgba(217, 142, 61, 0.15);
    border-color: #d98e3d;
  }

  /* Section Title */
  .section-title {
    text-align: right;
    padding: 20px 40px 10px;
  }

  .section-title h1 {
    font-size: 48px;
    font-weight: 800;
    display: inline-block;
    position: relative;
    padding-bottom: 15px;
  }

  .section-title h1::after {
    content: "";
    position: absolute;
    bottom: 0;
    right: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(to left, #d98e3d, transparent);
  }

  /* Menu Grid */
  .menu-container {
    padding: 20px 40px 60px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 60px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 25px;
  }

  .item-details {
    text-align: right;
    flex: 1;
  }

  .item-details h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .item-details .qty {
    color: #999;
    font-size: 14px;
    margin-bottom: 14px;
  }

  .item-details .price {
    color: #d98e3d;
    font-size: 22px;
    font-weight: 600;
  }

  .item-image {
    width: 170px;
    height: 170px;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    background: #222;
  }

  .item-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Tablet */
  @media (max-width: 1024px) {
    .header, .section-title, .menu-container {
      padding-left: 25px;
      padding-right: 25px;
    }

    .section-title h1 {
      font-size: 38px;
    }

    .item-image {
      width: 130px;
      height: 130px;
    }

    .item-details h2 {
      font-size: 20px;
    }

    .item-details .price {
      font-size: 18px;
    }

    .menu-container {
      gap: 20px 30px;
    }
  }

  /* Mobile */
  @media (max-width: 640px) {
    .header {
      padding: 15px 20px;
    }

    .logo {
      width: 70px;
      height: 70px;
    }

    .section-title {
      padding: 15px 20px 5px;
      text-align: center;
    }

    .section-title h1 {
      font-size: 30px;
    }

    .section-title h1::after {
      right: 50%;
      transform: translateX(50%);
    }

    .menu-container {
      grid-template-columns: 1fr;
      padding: 15px 20px 40px;
      gap: 25px;
    }

    .menu-item {
      justify-content: space-between;
    }

    .item-image {
      width: 100px;
      height: 100px;
    }

    .item-details h2 {
      font-size: 18px;
    }

    .item-details .qty {
      font-size: 12px;
      margin-bottom: 8px;
    }

    .item-details .price {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

  <div class="header">
    <a href="../index.html" class="nav-link"><div class="nav-arrow">&#8250;</div></a>
    <div class="logo-wrap">
      <div class="logo">
        <img src="../assets/logo.JPG" alt="Cafe Logo">
      </div>
    </div>
    <div></div>
  </div>

  <div class="section-title">
    <h1>بريوش</h1>
  </div>

  <div class="menu-container">
    <div class="menu-item">
      <div class="item-details">
        <h2>كرواسون سادة</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">4.00 د.ل</div>
      </div>
      <div class="item-image">
        <img src="../assets/CategoriesPictures/croissant.jpg" alt="كرواسون سادة">
      </div>
    </div>

    <div class="menu-item">
      <div class="item-details">
        <h2>كرواسون بالجبن</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">5.00 د.ل</div>
      </div>
      <div class="item-image">
        <img src="../assets/CategoriesPictures/croissant.jpg" alt="كرواسون بالجبن">
      </div>
    </div>

    <div class="menu-item">
      <div class="item-details">
        <h2>كرواسون بالشوكولاتة</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">5.00 د.ل</div>
      </div>
      <div class="item-image">
        <img src="../assets/CategoriesPictures/croissant.jpg" alt="كرواسون بالشوكولاتة">
      </div>
    </div>

    <div class="menu-item">
      <div class="item-details">
        <h2>كرواسون باللوز</h2>
        <div class="qty">قطعة واحدة</div>
        <div class="price">6.00 د.ل</div>
      </div>
      <div class="item-image">
        <img src="../assets/CategoriesPictures/croissant.jpg" alt="كرواسون باللوز">
      </div>
    </div>
  </div>

</body>
</html>
