<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عصائر طبيعية - Cafe Cinnabon</title>
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/cart.css">
</head>
<body>

  <div class="header">
    <a href="../index.html" class="nav-link"><div class="nav-arrow">&#8250;</div></a>
    <div class="logo-wrap">
      <div class="logo">
        <img src="../assets/logo.webp" alt="Cafe Logo">
      </div>
    </div>
    <div></div>
  </div>

  <div class="section-title">
    <h1>عصائر طبيعية</h1>
  </div>

  <div class="menu-container">
    <div class="menu-item" data-name="عصير برتقال" data-price="5.00">
      <div class="item-details">
        <h2>عصير برتقال</h2>
        <div class="qty">كوب واحد</div>
        <div class="price">5.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/freshJuice/3.webp" alt="عصير برتقال">
      </div>
    </div>

    <div class="menu-item" data-name="عصير مانجو" data-price="6.00">
      <div class="item-details">
        <h2>عصير مانجو</h2>
        <div class="qty">كوب واحد</div>
        <div class="price">6.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/freshJuice/4.webp" alt="عصير مانجو">
      </div>
    </div>

    <div class="menu-item" data-name="عصير فراولة" data-price="6.00">
      <div class="item-details">
        <h2>عصير فراولة</h2>
        <div class="qty">كوب واحد</div>
        <div class="price">6.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/freshJuice/1.webp" alt="عصير فراولة">
      </div>
    </div>

    <div class="menu-item" data-name="عصير ليمون بالنعناع" data-price="5.00">
      <div class="item-details">
        <h2>عصير ليمون بالنعناع</h2>
        <div class="qty">كوب واحد</div>
        <div class="price">5.00 د.ل</div>
      <button class="add-to-cart">أضف للسلة</button>
      </div>
      <div class="item-image">
        <img src="../assets/categories/freshJuice/2.webp" alt="عصير ليمون بالنعناع">
      </div>
    </div>
  </div>

<script src="../js/cart.js"></script>
</body>
</html>
